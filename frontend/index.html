<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link id="favicon" rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Powered CV Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter is the web fallback for SF Pro on non-Apple devices. Stylistic
       alternates ss01 + cv11 are enabled in CSS so it reads more SF-like. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
  <!-- Google Analytics (GA4) - set your Measurement ID below -->
  <script>
    window.GA_MEASUREMENT_ID = window.GA_MEASUREMENT_ID || 'G-GLSLFR0JXX';
    (function() {
      var GA_ID = window.GA_MEASUREMENT_ID;
      if (!GA_ID || GA_ID === 'G-XXXXXXXXXX') {
        // GA not configured yet; skip loading to avoid errors
        return;
      }
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      s.onload = function() {
        gtag('js', new Date());
        gtag('consent', 'default', { 'ad_storage': 'denied', 'analytics_storage': 'granted' });
        // We emit page views manually from the SPA; avoid double-counting here
        gtag('config', GA_ID, { send_page_view: false });
      };
      document.head.appendChild(s);
    })();
  </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react-icons/fa/": "https://esm.sh/react-icons/fa/",
    "react-icons/hi2/": "https://esm.sh/react-icons/hi2/",
    "react-icons/bs/": "https://esm.sh/react-icons/bs/",
    "react-icons/": "https://esm.sh/react-icons@^5.5.0/"
  }
}
</script>
<style>
  /* Apple-style typography stack.
     - Native SF Pro on Apple devices (no download).
     - Inter as the web fallback (designed in the SF spirit; ss01/cv11 features
       enabled make its single-storey 'a' / curl-less 'l' read closer to SF).
     - Display vs Text variants follow Apple's split: tight tracking on Display.
     - SF Mono first for code, JetBrains Mono as cross-platform fallback. */
  :root {
    --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro",
      "Inter", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro",
      "Inter", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco,
      "Cascadia Code", "Liberation Mono", monospace;
  }

  html, body {
    font-family: var(--font-system);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .font-headline {
    font-family: var(--font-display);
    font-feature-settings: "ss01", "cv11";
    letter-spacing: -0.022em; /* Apple's signature tight display tracking */
  }
  .font-numeric {
    font-family: var(--font-system);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum", "ss01";
  }
  .font-mono {
    font-family: var(--font-mono);
  }
  
  /* Hide scrollbar for Chrome, Safari and Opera */
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  /* Hide scrollbar for IE, Edge and Firefox */
  .hide-scrollbar {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  /* Consistent prose styles - now managed in index.css */
  .prose {
    max-width: 100%;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-100 text-gray-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
